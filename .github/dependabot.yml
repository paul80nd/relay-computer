# Keep dependencies current with weekly grouped Dependabot PRs. The CI workflow
# (lint + build + test) gates every PR, so a bad bump is caught before merge.
# Low-risk patch/minor bumps are grouped into one PR; majors get their own so
# they can be reviewed properly.
version: 2
updates:
  # --- npm packages ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Etc/UTC"
    cooldown:
      # Wait 7 days after an upstream release before bumping — guards against
      # immediately-yanked versions; cheap given the weekly cadence.
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # relay-computer-model is published to GitHub Packages, not the public npm
      # registry, so Dependabot can't resolve it here without a configured
      # registry + token. It's the same author's package, bumped by hand on each
      # release. To have Dependabot track it too: add a top-level `registries:`
      # block (type: npm-registry, url: https://npm.pkg.github.com, token from a
      # DEPENDABOT_GHPR_TOKEN secret with read:packages), reference it from this
      # update via `registries: [...]`, and remove this ignore entry.
      - dependency-name: "@paul80nd/relay-computer-model"
      # Angular's build/compiler-cli pin an exact TypeScript minor
      # (@angular/build → typescript ">=6.0 <6.1"), so a TS major (e.g. 7.x)
      # can't install until a future Angular adds support (#84 failed npm ci on
      # exactly this). Ignore TS majors; patch/minor within the supported 6.x
      # line still come through. Revisit when Angular's peer range widens.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # Angular packages are versioned in lockstep and declare exact peer
      # dependencies on each other (e.g. @angular/animations pins
      # @angular/core@=x.y.z), so a partial bump fails `npm ci` with ERESOLVE.
      # Keep the whole family — runtime, CLI/build tooling and @angular-eslint —
      # in one PR across all update types so they move together. NB a publish-
      # timing skew between members can still split a PR (one lands before the
      # cooldown clears the rest); top up the straggler by hand to match and
      # refresh the lockfile if that happens.
      angular:
        patterns:
          - "@angular*"
          - "@angular-eslint*"
      npm-patch-minor:
        update-types: ["patch", "minor"]
      npm-major:
        update-types: ["major"]
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"

  # --- GitHub Actions used in the workflows ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
